<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tejas Bharadwaj QR Code</title>
  <style>
    @page {
      size: letter;
      margin: .65in;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f0e6;
      color: #000;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(5.6in, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 .18in;
      font-family: Georgia, "Times New Roman", serif;
      font-size: .48in;
      line-height: .9;
    }

    img {
      width: 3.2in;
      max-width: 100%;
      height: auto;
      image-rendering: crisp-edges;
    }

    p {
      margin: .18in 0 0;
      font-size: .15in;
      line-height: 1.35;
    }

    .url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tejas Bharadwaj</h1>
    <img src="tejas-links-qr.svg" alt="QR code for Tejas Bharadwaj's links">
    <p>Scan for links</p>
    <p class="url">https://tejas-jb.github.io/links/</p>
  </main>
</body>
</html>
