<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tejas Bharadwaj Cap QR</title>
  <style>
    @page {
      size: letter;
      margin: 0.25in;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    .qr {
      width: 9in;
      height: 9in;
      display: grid;
      place-items: center;
      background: #f4f0e6;
      overflow: hidden;
    }

    .qr img {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: crisp-edges;
    }

    @media print {
      body {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="qr">
    <img src="tejas-links-qr.svg" alt="QR code for Tejas Bharadwaj's links">
  </main>
</body>
</html>
